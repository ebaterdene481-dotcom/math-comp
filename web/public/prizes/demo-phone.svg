<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" role="img" aria-label="Ухаалаг утас">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef1f6"/>
      <stop offset="1" stop-color="#dfe4ee"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a5bd9"/>
      <stop offset="0.55" stop-color="#7b5be0"/>
      <stop offset="1" stop-color="#e46fa0"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b2f38"/>
      <stop offset="1" stop-color="#454b57"/>
    </linearGradient>
  </defs>
  <rect width="480" height="270" fill="url(#bg)"/>
  <ellipse cx="240" cy="246" rx="150" ry="10" fill="#000" opacity="0.08"/>
  <!-- back phone -->
  <g transform="rotate(-12 300 140)">
    <rect x="262" y="34" width="112" height="210" rx="18" fill="url(#back)"/>
    <rect x="276" y="48" width="44" height="44" rx="10" fill="#1d2027"/>
    <circle cx="289" cy="61" r="8" fill="#0d0f13" stroke="#5a606c" stroke-width="2"/>
    <circle cx="307" cy="79" r="8" fill="#0d0f13" stroke="#5a606c" stroke-width="2"/>
  </g>
  <!-- front phone -->
  <g transform="rotate(6 200 140)">
    <rect x="140" y="26" width="118" height="222" rx="20" fill="#1d2027"/>
    <rect x="146" y="32" width="106" height="210" rx="15" fill="url(#scr)"/>
    <rect x="183" y="40" width="32" height="9" rx="4.5" fill="#1d2027"/>
    <text x="199" y="112" text-anchor="middle" font-family="system-ui, sans-serif" font-size="30" font-weight="700" fill="#fff">12:00</text>
    <rect x="166" y="200" width="66" height="5" rx="2.5" fill="#fff" opacity="0.7"/>
  </g>
</svg>
